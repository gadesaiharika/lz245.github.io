project:
  type: website
  output-dir: docs
  # Render every .qmd EXCEPT anything inside the output dir. Quarto copies
  # unrendered sources (e.g. protocols/_template.qmd) into docs/ as resources;
  # without this exclusion the next render picks those copies up as project
  # inputs and fails with "NotFound ... readfile docs/news/*.qmd".
  render:
    - "**/*.qmd"
    - "!docs/**"
  resources:
    - "assets/**"

# Build profiles:
#   prod    (default) — indexable, Google Analytics on. `quarto render` = production.
#   preview           — noindex, no analytics. For fork preview builds:
#                       PowerShell:  $env:QUARTO_PROFILE="preview"; quarto render
profile:
  default: prod

website:
  title: "Zhang Lab | Agricultural Microbiomes & Food Safety"
  description: "Agricultural Microbiomes, Microbial Genomics, and Food Safety Research at Mississippi State University"
  site-url: "https://lz245.github.io"
  repo-url: "https://github.com/lz245/lz245.github.io"

  favicon: assets/images/favicon.png

  open-graph:
    locale: en_US
    site-name: "Zhang Lab - MSU"
    image: assets/images/team/lab-psa-2025.jpg
  twitter-card:
    card-style: summary_large_image
    image: assets/images/team/lab-psa-2025.jpg

  search:
    location: navbar
    type: overlay

  navbar:
    background: "#660000"  # MSU maroon
    foreground: light
    logo: assets/images/lab-logo.png
    logo-alt: "Zhang Lab Logo"
    title: "Zhang Lab"
    pinned: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "People"
        href: people.qmd
      - text: "Research"
        href: research.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Lab Protocols"
        href: protocols/index.qmd
      - text: "News"
        href: news/index.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "Join Us"
        href: join.qmd
    right:
      - icon: bank
        href: https://www.poultry.msstate.edu/people/lz245
        aria-label: "MSU Profile"
      - icon: github
        href: https://github.com/lz245
        aria-label: GitHub
      - icon: envelope
        href: mailto:l.zhang@msstate.edu
        aria-label: Email

  sidebar: false
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: false
  reader-mode: false

format:
  html:
    theme:
      light: [cosmo, styles/custom.scss]
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "On This Page"
    anchor-sections: true
    smooth-scroll: true
    link-external-icon: false
    link-external-newwindow: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github

    grid:
      sidebar-width: 0px
      body-width: 950px
      margin-width: 260px
      gutter-width: 1.5rem

    include-after-body:
      - file: _partials/site-tail.html
